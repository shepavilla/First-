<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>App Europa 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style id="app-css">
:root{
  --bg:#E7EEF3; --paper:#FFFFFF; --ink:#172533; --muted:#5A6B7B; --line:#CAD6DF;
  --gold:#E2A42B; --gold-ink:#3A2A05; --stamp:#B5332E; --ok:#2E7D5B; --soft:#F3F7FA;
  --display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1923; --paper:#172431; --ink:#E7EEF4; --muted:#9CAEBE; --line:#2B3D4E;
    --gold:#EDB646; --gold-ink:#2A1E02; --stamp:#E0645E; --ok:#5CC495; --soft:#1C2C3A;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1923; --paper:#172431; --ink:#E7EEF4; --muted:#9CAEBE; --line:#2B3D4E;
  --gold:#EDB646; --gold-ink:#2A1E02; --stamp:#E0645E; --ok:#5CC495; --soft:#1C2C3A;
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 96px}

/* Header */
header.top{padding:28px 0 8px}
h1{font-family:var(--display);font-weight:800;font-size:clamp(2rem,8vw,3.1rem);line-height:1;letter-spacing:-.02em;margin:0}
h1 input{all:unset;width:100%;display:block}
.sub{color:var(--muted);margin:.5rem 0 0}
.status{font-size:.85rem;color:var(--muted);min-height:1.3em;margin-top:.25rem}
.status.err{color:var(--stamp)}
.banner{background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:.9rem;margin:12px 0;color:var(--muted)}

/* Route strip — the signature element */
.route{margin:22px 0 6px}
.route-bar{display:flex;gap:3px;align-items:stretch;height:60px;overflow-x:auto;scrollbar-width:none}
.route-bar::-webkit-scrollbar{display:none}
.route-bar .end{flex:0 0 auto;display:flex;align-items:center;font-family:var(--display);font-weight:600;font-size:.8rem;color:var(--muted);padding:0 4px;writing-mode:vertical-rl;transform:rotate(180deg)}
.seg{flex:0 0 auto;border:0;border-radius:6px;padding:7px 8px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;color:#fff;overflow:hidden;position:relative}
.seg b{font-family:var(--display);font-weight:800;font-size:.95rem;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg span{font-size:.75rem;opacity:.92;white-space:nowrap}
.wx{margin:10px 0 4px}
.wx-bar{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;-webkit-overflow-scrolling:touch}
.wx-bar::-webkit-scrollbar{display:none}
.wx-g{display:flex;gap:4px;flex:0 0 auto;width:max-content;min-width:max-content}
.wx-g>.wx-d{flex:0 0 74px;width:74px;min-width:74px;max-width:74px}
.wx-d{all:unset;box-sizing:border-box;cursor:pointer;flex:0 0 74px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px 5px;border-radius:8px;background:var(--paper);border:1px dashed var(--line);border-top:3px solid var(--c);font-size:.72rem;line-height:1.15;color:var(--ink);text-align:center}
.wx-d.fc{border-style:solid;border-top:3px solid var(--c)}
.wx-d:focus-visible{outline:3px solid var(--gold);outline-offset:1px}
.wx-h b{display:block;font-family:var(--display);font-weight:800;font-size:.8rem}
.wx-h i{display:block;font-style:normal;color:var(--muted);font-size:.66rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:66px}
.wx-ic{height:26px}
.wx-t{display:flex;gap:5px;font-variant-numeric:tabular-nums}
.wx-t .mx{font-weight:800;color:#C0603A}.wx-t .mn{font-weight:700;color:#3D86D6}
.wx-r,.wx-s{display:flex;align-items:center;gap:3px;font-variant-numeric:tabular-nums;color:var(--muted)}
.wx-r{color:var(--ink);font-weight:700}
.wx-k{margin-top:1px;font-size:.6rem;font-weight:700;letter-spacing:.02em;color:var(--muted);text-transform:uppercase}
.wx-d.fc .wx-k{color:var(--ok)}
.wx-na{color:var(--muted);font-size:.68rem;padding:10px 0}
.wx-cap{font-size:.8rem;color:var(--muted);margin:6px 0 0}
.route-cap{display:flex;justify-content:space-between;font-size:.8rem;color:var(--muted);margin-top:6px}

/* Tabs */
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:4px;padding:10px 0;margin-top:14px;border-bottom:1px solid var(--line)}
nav.tabs button{flex:1 1 auto;white-space:nowrap;border:0;background:transparent;padding:9px 4px;border-radius:8px;font-weight:700;color:var(--muted)}
nav.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.badge{display:inline-block;min-width:1.4em;padding:0 .35em;border-radius:99px;background:var(--stamp);color:#fff;font-size:.75rem;line-height:1.4em;margin-left:.3em;text-align:center}

/* Day list */
.days{list-style:none;margin:16px 0 0;padding:0;display:grid;gap:10px}
.day{background:var(--paper);border-radius:12px;border-left:6px solid var(--c,#8899aa);overflow:hidden}
.day-head{all:unset;box-sizing:border-box;width:100%;cursor:pointer;display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;padding:12px 14px 12px 10px}
.day-num{font-family:var(--display);font-weight:800;font-size:1.7rem;line-height:1;text-align:center;color:var(--c)}
.day-num small{display:block;font-family:var(--body);font-weight:800;font-size:.8rem;color:var(--c);margin-top:1px;letter-spacing:.02em}
.day-num em{display:block;font-style:normal;font-family:var(--body);font-weight:600;font-size:.62rem;color:var(--muted);margin-top:4px}
.ic{width:1em;height:1em;display:inline-block;vertical-align:-.12em}
.cc .mode{position:absolute;top:-8px;right:-7px;z-index:1;width:17px;height:17px;border-radius:50%;background:#fff;color:var(--c);display:grid;place-items:center;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.cc .mode .ic{width:12px;height:12px}
/* el ícono del trayecto va sobre la división de colores: abajo si se sale a otra ciudad a dormir, arriba si se llega en la mañana */
.cc .mode.at-bot{top:auto;bottom:-2.5px}
.cc .mode.at-top{top:-2.5px}
.legend .ic{width:13px;height:13px;margin-right:2px}
.leg .via{grid-column:1/-1;grid-row:2;display:flex;align-items:center;gap:8px;font-size:.78rem;color:var(--muted);margin:-2px 0}
.leg .via select{width:auto;padding:4px 8px;font-size:.8rem}
.day-title{display:block;font-weight:700;line-height:1.25}
.day-meta{display:block;font-size:.85rem;color:var(--muted);line-height:1.35;margin-top:2px}
.day-total{font-family:var(--display);font-weight:600;font-size:1rem;text-align:right;white-space:nowrap}
.day-total small{display:block;font-family:var(--body);font-size:.72rem;color:var(--muted);font-weight:400}
.pend{color:var(--stamp);font-weight:700}
.chev{transition:transform .2s;display:inline-block}
.day[open-day] .chev{transform:rotate(90deg)}
@media (prefers-reduced-motion: reduce){.chev{transition:none}}

/* Editor */
.editor{padding:4px 14px 16px;border-top:1px dashed var(--line)}
.sec{margin-top:18px}
.sec h3{font-family:var(--display);font-weight:600;font-size:1.05rem;margin:0 0 4px}
.sec .hint{font-size:.82rem;color:var(--muted);margin:0 0 8px}
label.f{display:block;font-size:.8rem;color:var(--muted);margin-bottom:8px}
label.f > input,label.f > textarea,label.f > select{display:block;width:100%;margin-top:3px}
input[type=text],input[type=number],input[type=date],input[type=time],textarea,select{
  background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:40px;width:100%}
textarea{resize:vertical;min-height:72px;line-height:1.45}
input:disabled,textarea:disabled,select:disabled{opacity:1;color:var(--ink);-webkit-text-fill-color:var(--ink)}
.pubbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:.85rem;color:var(--muted);margin-top:6px}
.pubbar button{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:5px 10px;font-weight:700;font-size:.85rem}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.leg{display:grid;grid-template-columns:1fr 112px 32px;gap:6px;align-items:center;background:var(--soft);border-radius:10px;padding:8px;margin-bottom:8px;position:relative}
.leg .arrow{grid-column:1/-1;grid-row:2;font-size:.78rem;color:var(--muted);margin:-2px 0}
.leg input{background:var(--paper)}
.row{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.row input{flex:1}
.x{border:0;background:transparent;color:var(--muted);width:36px;height:36px;border-radius:8px;flex:0 0 auto;font-size:1.1rem;line-height:1}
.x:hover{background:var(--soft);color:var(--stamp)}
.leg .x{grid-column:3;grid-row:1;width:32px}
.add{border:1px dashed var(--line);background:transparent;border-radius:8px;padding:7px 12px;color:var(--muted);font-weight:700;font-size:.88rem}
.add:hover{border-color:var(--ink);color:var(--ink)}
.cost{display:grid;grid-template-columns:1fr 100px 64px 68px;gap:6px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.cost:last-child{border-bottom:0}
.cost .lbl{font-size:.9rem}
.cost .lbl small{display:block;color:var(--muted);font-size:.75rem}
.cost input,.cost select{min-height:38px;padding:6px 8px}
.cost-sum{display:flex;justify-content:space-between;font-weight:700;padding-top:10px}
.danger{border:0;background:transparent;color:var(--stamp);font-weight:700;padding:8px 0;margin-top:14px}
.add-day{display:block;width:100%;margin-top:14px;padding:12px;border:2px dashed var(--line);border-radius:12px;background:transparent;font-weight:700;color:var(--muted)}
.empty{background:var(--paper);border-radius:12px;padding:28px 18px;text-align:center;margin-top:16px}

/* Budget */
.card{background:var(--paper);border-radius:12px;padding:16px;margin-top:14px}
.card h2{font-family:var(--display);font-weight:800;font-size:1.3rem;margin:0 0 10px;letter-spacing:-.01em}
.bigline{font-family:var(--display);font-weight:800;font-size:clamp(1.8rem,7vw,2.6rem);line-height:1.05;margin:0}
.bigline small{display:block;font-family:var(--body);font-weight:400;font-size:1rem;color:var(--muted);margin-top:6px;line-height:1.4}
.bar{display:grid;grid-template-columns:118px 1fr minmax(76px,auto);gap:8px;align-items:center;margin:7px 0;font-size:.9rem}
.bar .track{height:14px;background:var(--soft);border-radius:4px;overflow:hidden}
.bar .fill{height:100%;border-radius:4px;background:var(--gold)}
.bar .v{text-align:right;font-variant-numeric:tabular-nums}
.cols{display:flex;align-items:flex-end;gap:3px;height:120px;margin-top:8px}
.cols button{all:unset;cursor:pointer;flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;min-width:8px}
.cols i{display:block;border-radius:3px 3px 0 0;min-height:2px}
.cols-x{display:flex;gap:3px;font-size:.66rem;color:var(--muted);margin-top:3px}
.cols-x span{flex:1;text-align:center;min-width:8px}
.todo{list-style:none;padding:0;margin:0}
.todo li{padding:9px 0;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:baseline}
.todo li:last-child{border-bottom:0}
.todo button{all:unset;cursor:pointer;font-weight:700;color:var(--stamp);white-space:nowrap}
.todo .ok{color:var(--ok)}
nav.tabs{overflow-x:auto;scrollbar-width:none}nav.tabs::-webkit-scrollbar{display:none}
@media (max-width:400px){nav.tabs{gap:1px}nav.tabs button{font-size:.8rem;padding:9px 3px}nav.tabs .badge{margin-left:.15em;font-size:.68rem;min-width:1.3em;padding:0 .3em}}
.bk-prog{height:10px;background:var(--soft);border-radius:5px;overflow:hidden}
.bk-prog i{display:block;height:100%;background:var(--ok);border-radius:5px}
.bk-sec h3{font-family:var(--display);font-weight:800;font-size:1.05rem;margin:0 0 6px;display:flex;align-items:center;gap:6px}
.bk-sec h3 small{margin-left:auto;font-family:var(--body);font-weight:700;font-size:.8rem;color:var(--muted)}
.bk-sec.trip{background:var(--soft);border:1px dashed var(--line)}
.bk-list{list-style:none;margin:0 0 8px;padding:0}
.bk{display:grid;grid-template-columns:30px 1fr;gap:6px;padding:9px 0;border-bottom:1px solid var(--line)}
.bk:last-child{border-bottom:0}
.bk-chk{display:flex;justify-content:center;padding-top:2px}
.bk-chk input{width:20px;height:20px;accent-color:var(--ok);margin:0}
.bk-t{font-weight:700;line-height:1.25}
.bk.done .bk-t{color:var(--ok)}
.rsv.okc{color:var(--ok);border-color:var(--ok)}
.bk-meta{font-size:.8rem;color:var(--muted);margin-top:2px}
.bk-meta .rsv{margin:0 0 0 4px;font-size:.68rem;padding:0 7px}
.bk-info{font-size:.85rem;margin:4px 0 0;line-height:1.4;overflow-wrap:anywhere}
.bk-pend{color:var(--stamp);font-weight:700}
.bk-edit{border:0;background:transparent;padding:4px 0 0;color:var(--muted);font-weight:700;font-size:.8rem;text-decoration:underline}
.bk-form{margin-top:8px;background:var(--soft);border-radius:10px;padding:10px}
.bk-sec.trip .bk-form{background:var(--paper)}
.pay-g{border-top:1px solid var(--line)}
.pay-g summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:88px 1fr auto;gap:8px;align-items:center;padding:9px 0}
.pay-g summary::-webkit-details-marker{display:none}
.pay-g summary:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.pay-n{font-weight:800;font-family:var(--display)}
.pay-n::before{content:"›";display:inline-block;margin-right:6px;color:var(--muted);transition:transform .15s}
.pay-g[open] .pay-n::before{transform:rotate(90deg)}
.pay-g.none .pay-n{color:var(--muted);font-weight:700}
.pay-g .track{height:12px;background:var(--soft);border-radius:4px;overflow:hidden}
.pay-g .fill{height:100%;border-radius:4px}
.pay-g .v{text-align:right;font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.pay-g .v small{display:block;font-weight:400;color:var(--muted);font-size:.75rem}
.pay-l{list-style:none;margin:0 0 8px;padding:0 0 0 14px}
.pay-l li{display:flex;justify-content:space-between;gap:10px;padding:5px 0;font-size:.88rem;border-top:1px dashed var(--line)}
.pay-l button{all:unset;cursor:pointer;color:var(--ink);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.pay-l span{font-variant-numeric:tabular-nums;white-space:nowrap}
.pchip{display:inline-block;font-size:.68rem;font-weight:800;border:1px solid var(--line);border-radius:999px;padding:0 6px;margin-left:4px;color:var(--muted);vertical-align:1px}
@media (prefers-reduced-motion: reduce){.pay-n::before{transition:none}}
.bk-plat{font-size:.8rem;color:var(--muted);margin-top:3px}
.bk-plat b{color:var(--ink);font-weight:700}
.bk-plat i{font-style:normal;color:var(--stamp);font-weight:700}
.bk-web a{color:var(--ink);font-weight:700;text-decoration:underline;text-underline-offset:2px;text-decoration-thickness:1px;word-break:break-word}
.cx-list{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.cx-i button{all:unset;box-sizing:border-box;cursor:pointer;width:100%;display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;background:var(--soft);border-left:4px solid var(--line)}
.cx-i button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.cx-d{text-align:center;line-height:1}
.cx-d b{display:block;font-family:var(--display);font-weight:800;font-size:1.35rem}
.cx-d small{display:block;font-weight:800;font-size:.72rem;color:var(--muted);margin-top:2px}
.cx-t{min-width:0}
.cx-n{display:block;font-weight:700;font-size:.9rem;line-height:1.25}
.cx-m{display:block;font-size:.78rem;color:var(--muted);margin-top:1px}
.cx-c{font-size:.75rem;font-weight:700;white-space:nowrap;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.cx-i.urg button{border-left-color:var(--stamp)}.cx-i.urg .cx-c{color:#fff;background:var(--stamp);border-color:var(--stamp)}
.cx-i.soon button{border-left-color:var(--gold)}.cx-i.soon .cx-c{color:var(--gold-ink);background:var(--gold);border-color:var(--gold)}
.cx-i.ok button{border-left-color:var(--ok)}.cx-i.ok .cx-c{color:var(--ok);border-color:var(--ok)}
.cx-i.past button{opacity:.6}
@media (max-width:400px){.cx-i button{grid-template-columns:38px 1fr;}.cx-c{grid-column:2;justify-self:start}}
.bk.flash{animation:bkflash 1.6s ease-out}
@keyframes bkflash{0%,40%{background:color-mix(in srgb,var(--gold) 30%,transparent)}100%{background:transparent}}
@media (prefers-reduced-motion: reduce){.bk.flash{animation:none;outline:2px solid var(--gold)}}
/* View switch */
.switch{display:flex;background:var(--paper);border-radius:10px;padding:4px;margin-top:16px;gap:4px}
.switch button{flex:1;border:0;background:transparent;border-radius:7px;padding:8px;font-weight:700;color:var(--muted)}
.switch button[aria-pressed="true"]{background:var(--gold);color:var(--gold-ink)}
.switch.cur{margin-top:14px}
.rates-note{font-size:.82rem;color:var(--muted);margin:10px 0 0;line-height:1.4}

/* Calendar */
.month{background:var(--paper);border-radius:12px;padding:14px 10px 12px;margin-top:14px}
.month h2{font-family:var(--display);font-weight:800;font-size:1.15rem;margin:0 4px 10px;letter-spacing:-.01em}
.wk,.mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.mgrid{grid-auto-rows:1fr}
.mgrid .cc.trip{aspect-ratio:auto}
.wk span{text-align:center;font-size:.72rem;font-weight:700;color:var(--muted);padding-bottom:4px}
.cc{all:unset;box-sizing:border-box;aspect-ratio:1/1.12;border-radius:8px;padding:9px 4px 9px;display:flex;flex-direction:column;justify-content:space-between;min-width:0;position:relative;color:var(--muted)}
.cc .cn{font-family:var(--display);font-weight:800;font-size:1.05rem;line-height:1}
.cc{container-type:inline-size}
.cc .cn{white-space:nowrap;overflow:hidden;font-size:1.05rem}
.cc .cn .cm{font-size:.6em;margin-left:.12em}
.cc .cn .cf{font-family:var(--body);font-weight:800;font-size:.6em;margin-left:.1em}
.cc .cm{font-family:var(--body);font-weight:700;font-size:.62rem;margin-left:2px;letter-spacing:.01em}

.cc.trip{cursor:pointer;background:var(--c);color:#fff}

.cc .tstripe{position:absolute;left:0;right:0;top:0;height:6px;background:var(--t);border-radius:8px 8px 0 0;box-shadow:0 1.5px 0 rgba(255,255,255,.85)}
.cc .sstripe{position:absolute;left:0;right:0;bottom:0;height:6px;background:var(--s);border-radius:0 0 8px 8px;box-shadow:0 -1.5px 0 rgba(255,255,255,.85)}
.cc.trip:hover{filter:brightness(1.08)}
.cc.split{background:transparent}
.cc.split .bands{position:absolute;inset:0;display:flex;flex-direction:column;border-radius:8px;overflow:hidden;z-index:0}
.cc.split .band{display:flex;align-items:flex-end;width:100%;flex:none;overflow:hidden}
.cc.split{padding-top:5px}

.cc.split>.cn,.cc.split>span:not(.bands):not(.bic){position:relative;z-index:1}
.cc.split .bic{position:absolute;right:-6px;z-index:2;width:15px;height:15px;margin-top:-7.5px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 1px 3px rgba(0,0,0,.3)}

.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.82rem;color:var(--muted);margin-top:12px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* Day detail sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(10,18,26,.45);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-width:680px;margin:0 auto;background:var(--paper);border-radius:16px 16px 0 0;max-height:88%;display:flex;flex-direction:column;box-shadow:0 -6px 30px rgba(0,0,0,.25);border-top:6px solid var(--c)}
.sheet-head{display:grid;grid-template-columns:36px 1fr 36px 36px;gap:4px;align-items:start;padding:12px 10px 10px;border-bottom:1px solid var(--line)}
.sheet-head h2{font-family:var(--display);font-weight:800;font-size:1.3rem;line-height:1.15;margin:2px 0 2px}
.sheet-head .kick{font-weight:700;color:var(--c);font-size:.9rem}
.sheet-head p{margin:0;color:var(--muted);font-size:.88rem}
.sheet-head .x{font-size:1.4rem}

.sheet-body{overflow-y:auto;padding:4px 16px 12px;-webkit-overflow-scrolling:touch}
.sheet-body h3{font-family:var(--display);font-weight:600;font-size:1rem;margin:16px 0 6px}
.rsv{display:inline-block;font-size:.72rem;font-weight:700;border-radius:999px;padding:1px 8px;margin:2px 0 4px;border:1px solid}
.rsv.ob{color:var(--stamp);border-color:var(--stamp)}
.rsv.rc{color:var(--gold-ink);background:var(--gold);border-color:var(--gold)}
.rsv.sr{color:var(--muted);border-color:var(--line)}
.rsv-n{color:var(--muted);font-size:.78rem}
.sheet-body ul{margin:0;padding-left:1.1em}
.sheet-body li{margin:2px 0}
.sheet-body li.lg{list-style:none;margin:6px 0 6px -1.1em;padding:7px 10px;background:var(--soft);border-left:3px solid var(--c);border-radius:0 8px 8px 0;line-height:1.35}
.sheet-body li.lg .ic{width:15px;height:15px;color:var(--c);vertical-align:-2px}
.sheet-body li.lg small{display:block;color:var(--muted);font-size:.8rem;margin-top:2px}
.lgx{display:block;font-size:.84rem;margin-top:2px}
.leg-x{grid-column:1/-1;display:grid;grid-template-columns:78px 1fr;gap:6px}
.leg-x .lx-no{grid-column:1/-1}
.pre{white-space:pre-line;background:var(--soft);border-radius:8px;padding:9px 11px;font-size:.92rem}
.maplink{color:inherit;text-decoration:underline;text-underline-offset:2px;text-decoration-thickness:1px}

.legs-d{display:grid;gap:6px}
.legs-d div{background:var(--soft);border-radius:8px;padding:8px 10px;font-size:.95rem}
.legs-d small{color:var(--muted)}
.mt{width:100%;border-collapse:collapse;font-size:.93rem}
.mt td{padding:5px 0;border-bottom:1px solid var(--line)}
.mt td:last-child{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.mt td small{color:var(--muted)}
.mt tr.tot td{font-weight:700;border-bottom:0;padding-top:8px}
.sheet-foot{padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.sheet-foot .btn{width:100%}
body.lock{overflow:hidden}
.btn{border:0;background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:10px;font-weight:700}
.note{font-size:.85rem;color:var(--muted)}
@media (max-width:420px){
  .cost{grid-template-columns:1fr 84px 60px 64px}
  .cost select{padding-left:4px;padding-right:2px}
  .bar{grid-template-columns:88px 1fr minmax(64px,auto)}
}
</style>

hoy.", "main": ""}, {"activities": ["Notre Dame (1 h) · Reserva recomendada: gratis, la reserva evita la fila", "Barrio Latino (1–1,5 h) · Sin reserva", "Universidad La Sorbona (15–30 min) · Sin reserva: se ve por fuera", "Jardín de Luxemburgo (1 h) · Sin reserva", "Panthéon (1 h) · Sin reserva: se compra en taquilla", "Almuerzo: raclette en Saveurs de Savoie, rue Mouffetard (1–1,5 h) · Reserva recomendada: miércoles 12:00–14:30; TheFork o +33 1 45 87 90 29", "Caminata tranquila por la Butte-aux-Cailles, barrio local con aire de pueblo (1–1,5 h) · Sin reserva", "Museo Louvre (3 h) · Reserva obligatoria: entrada con horario", "Opcional: Museo de Orsay (2,5–3 h) · Reserva recomendada: entrada con horario", "Opcional: Catacumbas (1–1,5 h) · Reserva obligatoria: cupos limitados con horario"], "costs": {"desayuno": {"c": "EUR", "m": null, "by": ""}, "almuerzo": {"c": "EUR", "m": null, "by": ""}, "cena": {"c": "EUR", "m": null, "by": ""}, "transporte": {"c": "EUR", "m": null, "by": ""}, "museos": {"c": "EUR", "m": null, "by": ""}, "compras": {"c": "EUR", "m": null, "by": ""}, "otros": {"c": "EUR", "m": null, "by": ""}}, "date": "2026-12-30", "id": "d06", "legs": [{"arr": "", "dep": "", "from": "París", "mode": "", "to": "París"}], "place": "PARÍS · Notre Dame, Barrio Latino, Butte-aux-Cailles y Louvre", "reservas": "Pendiente: entrada con horario para el Louvre hacia las 17:30 (miércoles; abre hasta las 21:00)\nPendiente (opcional): entradas con horario para las Catacumbas", "sleep": "París", "stay": {"name": "", "rate": {"m": 332, "c": "EUR", "by": "CE"}, "details": ""}, "tips": "Restaurantes en la ruta de hoy:\n**Saveurs de Savoie** (raclette y fondue saboyana, tartiflette; [[83 Rue Mouffetard, 75005|Saveurs de Savoie, 83 Rue Mouffetard, 75005 Paris]], Barrio Latino; cierra los lunes, martes solo cena 18:00–23:30, mié a vie 12:00–14:30 y 18:00–23:30, sáb y dom 12:00–15:00 y 18:00–23:30; reservar en TheFork o +33 1 45 87 90 29; a ~1,7 km del Airbnb: 20 min a pie cruzando el Pont de Sully, o ~10 min en metro, línea 7 de Sully-Morland a Place Monge)\nRuta: Notre Dame temprano, a pasos del Airbnb; Barrio Latino y la Sorbona, Jardín de Luxemburgo y Panthéon. Del Panthéon bajar a pie por la rue Mouffetard (mercado y vida de barrio) y almorzar raclette en Saveurs de Savoie (n.º 83; los miércoles abre a mediodía, 12:00–14:30); luego seguir a la Butte-aux-Cailles, unos 20 min. Butte-aux-Cailles: calles empedradas, casitas bajas, arte callejero y cafés de vecinos, casi sin turistas; buen sitio para un café. Metro: Corvisart (línea 6) o Place d'Italie (líneas 5, 6 y 7). De Place d'Italie la línea 7 va directo al Louvre (estación Palais Royal–Musée du Louvre, unos 20 min) y de regreso al Airbnb (Sully–Morland). Louvre en la tarde: los miércoles abre hasta las 21:00. Visitas: 8,5 a 9,5 h.\nOpcionales solo si sobra tiempo: Orsay queda frente al Louvre, al otro lado del Sena; las Catacumbas, en Denfert-Rochereau, cerca de la Butte-aux-Cailles.", "main": ""}, {"activities": ["Montmartre (1–1,5 h) · Sin reserva", "Iglesia Sagrado Corazón (45 min) · Sin reserva: gratis", "Place du Tertre (30 min) · Sin reserva", "Ópera (45 min–1 h) · Reserva recomendada: para la visita interior; confirmar horario del 31", "Galerías Lafayette (1 h) · Sin reserva", "Jardín de las Tullerías (30 min) · Sin reserva", "Plaza de la Concordia (15 min) · Sin reserva", "Grand y Petit Palais (30–45 min) · Sin reserva", "Campos Elíseos (1 h) · Sin reserva", "Arco del Triunfo (1 h) · Reserva recomendada: para subir a la terraza", "Año Nuevo en los Campos Elíseos: video mapping en el Arco, cuenta regresiva y fuegos artificiales (2–3 h) · Sin reserva: gratis; entrada principal por la Concordia"], "costs": {"desayuno": {"c": "EUR", "m": null, "by": ""}, "almuerzo": {"c": "EUR", "m": null, "by": ""}, "cena": {"c": "EUR", "m": null, "by": ""}, "transporte": {"c": "EUR", "m": null, "by": ""}, "museos": {"c": "EUR", "m": null, "by": ""}, "compras": {"c": "EUR", "m": null, "by": ""}, "otros": {"c": "EUR", "m": null, "by": ""}}, "date": "2026-12-31", "id": "d07", "legs": [{"arr": "", "dep": "", "from": "París", "mode": "", "to": "París"}], "place": "PARÍS · Montmartre, Ópera y Año Nuevo en los Campos Elíseos", "reservas": "Pendiente: reservar cena del 31 cerca de la Concordia o la Madeleine (menús especiales, se llenan)", "sleep": "París", "stay": {"name": "", "rate": {"m": 332, "c": "EUR", "by": "CE"}, "details": ""}, "tips": "Ruta: Montmartre en la mañana, bajar a la Ópera y Lafayette, caminar a las Tullerías y seguir por la Concordia y los Campos Elíseos hasta el Arco del Triunfo. Subir el Arco de día: la noche del 31 la zona se cierra y la terraza cierra temprano. Volver a cenar cerca de la Concordia o la Madeleine.\nAño Nuevo: la avenida se cierra al tráfico a las 19:00. Llegar entre las 21:00 y las 22:00, entrar por la Concordia (o por las avenidas Montaigne, Matignon o Franklin D. Roosevelt) y ubicarse en la mitad alta, entre Franklin D. Roosevelt y George V, con vista al Arco. Hacia las 23:50 empieza el video mapping, luego la cuenta regresiva y los fuegos.\nProhibido entrar con alcohol, botellas de vidrio o pirotecnia. Llevar abrigo y algo para la lluvia.\nRegreso: transporte público gratis del 31 a las 17:00 al 1-ene a mediodía. Las estaciones de la zona cierran y reabren hacia la 1:00; la línea 1 deja cerca de Bastille. A pie: unos 45 min por la rue de Rivoli hasta el Airbnb.\nAl día siguiente es Disneyland: no trasnochar de más.\nLafayette y la Ópera pueden cerrar más temprano por ser 31. Confirmar el programa final en paris.fr.", "main": ""}, {"activities": ["Euro Disney (todo el día, 10–11 h) · Reserva obligatoria: boleto con fecha"], "costs": {"desayuno": {"c": "EUR", "m": null, "by": ""}, "almuerzo": {"c": "EUR", "m": null, "by": ""}, "cena": {"c": "EUR", "m": null, "by": ""}, "transporte": {"c": "EUR", "m": null, "by": ""}, "museos": {"c": "EUR", "m": null, "by": ""}, "compras": {"c": "EUR", "m": null, "by": ""}, "otros": {"c": "EUR", "m": null, "by": ""}}, "date": "2027-01-01", "id": "d08", "legs": [{"arr": "", "dep": "", "from": "París", "mode": "", "to": "París"}], "place": "PARÍS · Disneyland", "reservas": "Pendiente: entradas de Disneyland para el 1-ene", "sleep": "París", "stay": {"name": "", "rate": {"m": 332, "c": "EUR", "by": "CE"}, "details": ""}, "tips": "El 1 de enero cierran el Louvre, las Catacumbas, el Museo Rodin, el Picasso y el Carnavalet; el Arco del Triunfo y la Sainte-Chapelle probablemente también. Disney abre con horario completo, por eso es buen día para ir.\nSí abren: Torre Eiffel, Notre Dame, Sagrado Corazón, Museo de Orsay (desde las 10:00), Orangerie, Grévin, Torre Montparnasse, Quai Branly y los cruceros por el Sena.\nVersalles y la Conciergerie: las guías no coinciden, confirmar si interesa.\nHorarios tomados de guías del año pasado: confirmarlos en la web de cada sitio unas semanas antes.", "main": ""}, {"activities": ["Milán: de Linate a Milano Centrale en taxi (20–25 min, ~25–35 €) · Sin reserva: con solo equipaje de mano se sale rápido del aeropuerto", "Milán: dejar las maletas en la consigna KiPoint de [[Milano Centrale|KiPoint deposito bagagli, Stazione Milano Centrale, Piazza Duca d'Aosta 1, Milano]] (15 min) · Sin reserva: planta baja de la galería comercial, letreros \"Deposito bagagli\"; todos los días 7:00–21:00; ~6 € por maleta las primeras 5 h y 1 € por hora extra", "Varenna: de la estación al muelle, bajando al lago ([[Imbarcadero di Varenna|Imbarcadero Varenna, Navigazione Lago di Como]]) (10 min) · Sin reserva: el boleto del ferry se compra en la taquilla del muelle", "Bellagio: paseo por el pueblo: callejones en escalera, malecón y la Punta Spartivento con vista a los brazos del lago (1 h 40 min) · Sin reserva: en invierno muchas tiendas cierran y los jardines de las villas suelen estar cerrados hasta la primavera", "Varenna: almuerzo y paseo por la orilla (Passeggiata dell'Amore) (50 min) · Sin reserva: en invierno abren pocos restaurantes, conviene tener 2 opciones; del muelle a la estación hay ~10 min a pie", "Milán: Santa Maria delle Grazie (Última Cena) (45 min) · Reserva obligatoria: turno hacia las 16:00 (llegar 15:30 a la taquilla); se agota con meses de anticipación", "Milán: Piazza del Duomo al anochecer, con el árbol y las luces de Navidad (1 h) · Sin reserva: la catedral por dentro es opcional (abre hasta las 19:00)", "Milán: volver a Milano Centrale y recoger las maletas (20 min) · Sin reserva: metro M3 amarilla de Duomo a Centrale, 4 paradas", "Llegada a Venecia y traslado al hotel en vaporetto o taxi acuático (30–45 min) · Reserva recomendada: el taxi acuático conviene reservarlo"], "costs": {"desayuno": {"c": "EUR", "m": null, "by": ""}, "almuerzo": {"c": "EUR", "m": null, "by": ""}, "cena": {"c": "EUR", "m": null, "by": ""}, "transporte": {"c": "COP", "m": 3077754, "by": "MG"}, "museos": {"c": "EUR", "m": null, "by": ""}, "compras": {"c": "EUR", "m": null, "by": ""}, "otros": {"c": "EUR", "m": 140, "by": ""}}, "date": "2027-01-02", "id": "d09", "legs": [{"from": "París", "dep": "6:45", "to": "Milán", "arr": "8:15", "mode": "avion", "dc": "ORY", "dt": "Orly 3", "ac": "LIN", "at": "Linate (terminal única)", "no": "U24959 (easyJet)"}, {"from": "Milán", "dep": "9:20", "to": "Varenna", "arr": "10:24", "mode": "tren", "dt": "Milano Centrale", "at": "Varenna-Esino", "no": "Tren regional Trenord 2818"}, {"from": "Varenna", "dep": "10:35", "to": "Bellagio", "arr": "10:45", "mode": "ferry", "dt": "Imbarcadero Varenna", "at": "Imbarcadero Bellagio", "no": "Ferry Navigazione Laghi"}, {"from": "Bellagio", "dep": "12:25", "to": "Varenna", "arr": "12:35", "mode": "ferry", "dt": "Imbarcadero Bellagio", "at": "Imbarcadero Varenna", "no": "Ferry Navigazione Laghi"}, {"from": "Varenna", "dep": "13:35", "to": "Milán", "arr": "14:43", "mode": "tren", "dt": "Varenna-Esino", "at": "Milano Centrale", "no": "Tren regional Trenord 2827"}, {"from": "Milán", "dep": "18:35", "to": "Venecia", "arr": "21:03", "mode": "tren", "dt": "Milano Centrale", "at": "Venezia Santa Lucia", "no": "Italo 8995 (alternativa: Frecciarossa 9757 de las 19:15, llega 21:42)"}], "place": "VENECIA · Lago de Como (Bellagio y Varenna) en la mañana, Milán en la tarde y llegada a Venecia en la noche", "reservas": "Vuelo easyJet U24959 (operado por easyJet Europe) · París Orly (ORY) 6:45 → Milán Linate (LIN) 8:15 · directo 1 h 30 min · código de reserva KDLKK48 · asientos 3B, 3C, 3D y 3E\nReserva CONFIRMADA en Booking.com junto con el vuelo Madrid→París: total COP 3.077.754 por los 4 (tiquetes COP 1.750.719 + selección de asientos COP 1.327.036)\nPendiente: COMPRAR MALETA DE MANO (carry-on) PARA LOS 4. La tarifa solo incluye 1 artículo personal por persona (la mochila, bajo el asiento) y no incluye la maleta de mano. No hace falta maleta de bodega. Agregarla antes del viaje sale mucho más barato que en el aeropuerto (en Booking: Manage booking, o en easyjet.com con el código KDLKK48)\nConsigna de maletas (sin reserva, dentro de la estación): KiPoint Milano Centrale, 7:00–21:00; ~11 € por maleta de 9:00 a 18:00\nTrenes regionales al lago (Trenord, se compran el mismo día en la app Trenord o en las máquinas de la estación): ida Milano Centrale 9:20 → Varenna-Esino 10:24 (tren 2818); regreso Varenna-Esino 13:35 → Milano Centrale 14:43 (tren 2827). Ferry Varenna ⇄ Bellagio (Navigazione Laghi, boleto en la taquilla del muelle): ida 10:35, regreso hacia las 12:25; 10 min. Horarios del calendario actual: confirmar los de invierno tras el cambio de mediados de diciembre\nPendiente: tren Milano Centrale → Venezia Santa Lucia sáb 2-ene 18:35 (Italo 8995, llega 21:03) o Frecciarossa 9757 19:15 (llega 21:42); comprar con anticipación en italotreno.com o trenitalia.com\nHotel en Venecia: Albergo Cavalletto (Agoda 1066356014), 2 noches; avisar la llegada hacia las 21:00–22:00\nPendiente: boletos Última Cena (Cenacolo Vinciano) para el sáb 2-ene, turno de la tarde hacia las 16:00 (entre 15:45 y 16:30). Solo en el canal oficial: cenacolovinciano.vivaticket.it (máx. 5 por compra) o call center +39 02 92800360 (máx. 9). Los de enero 2027 aún no salen a la venta: el museo avisa 1 a 4 días antes y abre a las 12:00 de Italia (5:00–6:00 de Colombia); el bloque anterior salió unos 2 meses y medio antes. Plan B: cada miércoles a las 12:00 de Italia liberan boletos para la semana siguiente; para el 2-ene, el miércoles 23-dic.", "sleep": "Venecia", "stay": {"name": "Albergo Cavalletto & Doge Orseolo ★★★★ · [[Calle del Cavalletto, Venecia|Albergo Cavalletto e Doge Orseolo, Calle del Cavalletto 1107, 30124 Venezia]]", "rate": {"m": 367.42, "c": "USD", "by": "CE"}, "details": "Reserva Agoda CONFIRMADA · Booking ID: 1066356014 (2 noches, reemplaza a la 1065083058)\nDirección: [[Calle del Cavalletto 1107, 30124 Venecia|Albergo Cavalletto e Doge Orseolo, Calle del Cavalletto 1107, 30124 Venezia]] (junto a la Plaza San Marcos)\nTeléfono: +39 041 520 0955 · cavalletto@sanmarcohotels.com\nEntrada: sáb 2-ene desde las 14:00 · Salida: lun 4-ene hasta las 11:00\n2 habitaciones Classic Double or Twin · 4 adultos · huésped principal: Carlos Villa\nIncluye: wifi gratis y desayuno · pedidos: no fumadores, cama grande, habitaciones contiguas (sujeto a disponibilidad)\nValor: 694,68 USD (habitaciones 631,54 + tasas 63,14), cargo automático el 28-dic-2026 a la tarjeta\nEn el hotel: tasa municipal de 40,16 USD (se paga al llegar) · total del alojamiento: 734,84 USD\nCancelación gratis hasta el 29-dic-2026 23:59 (hora de Venecia); desde el 30-dic se cobra el 70 %; desde el 2-ene, el 100 %\nLlevar el voucher de Agoda; en el check-in pueden pedir la tarjeta y el documento del titular\nPendiente: confirmar en Agoda que la reserva anterior 1065083058 (solo 3–4 ene) quedó cancelada, para no pagar doble\nPendiente: avisar al hotel la llegada hacia las 21:00–22:00"}, "tips": "Ruta (sábado 2):\n• 4:15 salir del Airbnb hacia Orly (vuelo de las 6:45). 8:15 llegada a Linate y taxi a Milano Centrale (~9:00); maletas a la consigna KiPoint.\n• 9:20 tren regional a Varenna-Esino (llega 10:24): conviene tener los boletos comprados en la app Trenord la noche anterior, porque el margen desde el aeropuerto es corto. Si se pierde, el siguiente sale a las 10:20 y el día se corre una hora (Bellagio más corto y regreso en el tren de las 14:35, que llega 15:43; la Última Cena hacia las 16:30).\n• De la estación de Varenna al muelle, ~10 min a pie bajando al lago ([[Imbarcadero di Varenna|Imbarcadero Varenna, Navigazione Lago di Como]]). Ferry de las 10:35 a Bellagio (10 min; [[Imbarcadero di Bellagio|Imbarcadero Bellagio, Navigazione Lago di Como]]).\n• 10:45–12:25 Bellagio. Ferry de vuelta a Varenna hacia las 12:25. 12:40–13:25 almuerzo y paseo en Varenna. 13:35 tren a Milano Centrale (llega 14:43).\n• De Centrale, metro M2 verde directo a Cadorna (5 paradas, ~10 min) y ~10 min a pie a Santa Maria delle Grazie ([[Piazza Santa Maria delle Grazie 2|Cenacolo Vinciano, Piazza Santa Maria delle Grazie 2, Milano]]; entrada por Corso Magenta). Llegar 15:30 para el turno de las 16:00.\n• 16:45–17:45 Piazza del Duomo (volver a pie a Cadorna, ~10 min, y metro M1 roja a Duomo, 3 paradas). Metro M3 amarilla a Centrale, recoger maletas y tren de las 18:35 a Venecia (llega 21:03).\nHorarios: la Última Cena abre de martes a domingo de 8:15 a 19:00 (último ingreso 18:45), así que el sábado 2 está abierta. Los trenes regionales salen más o menos cada hora y el ferry cada 30–60 min en invierno: revisar los horarios definitivos de Trenord y Navigazione Laghi para el 2 de enero unos días antes.\nLlegada a Venecia (~21:03): vaporetto línea 2 desde Ferrovia hasta Rialto o San Marco (25–30 min) o línea 1 (~40 min), y caminar pocos minutos al hotel; con 4 maletas, el taxi acuático deja cerca de la puerta (más de 70 €). Venecia es muy segura de noche; lo difícil son los puentes con escalones.\nConsigna en Milano Centrale: KiPoint, dentro de la estación ([[Piazza Duca d'Aosta 1, Milán|KiPoint deposito bagagli, Stazione Milano Centrale, Piazza Duca d'Aosta 1, Milano]]), planta baja de la galería comercial (seguir los letreros \"Deposito bagagli\"). Abre todos los días de 7:00 a 21:00, así que cubre de la llegada (~9:00) a la recogida (~18:00); unos 6 € por maleta las primeras 5 horas y 1 € cada hora extra (~11 € por maleta, ~44 € las 4).\nEquipaje en easyJet: solo va incluido un artículo personal por persona (la mochila, bajo el asiento). La maleta de mano grande hay que pagarla aparte, salvo que los asientos elegidos ya la incluyan (en easyJet los asientos Up Front y de espacio extra suelen incluirla): revisarlo en easyjet.com con el código KDLKK48 antes de comprar.\nEl transporte de este día lleva el valor de la reserva conjunta Transavia + easyJet: COP 3.077.754 (con asientos), todavía sin las maletas de mano.\nÚltima Cena: 15 € adulto (2 € de 18 a 25 años). Boletos nominativos con el nombre de los cuatro, sin cambios ni reembolso: llevar pasaporte. Llegar 30 min antes a la taquilla con el comprobante de pago o se pierde la entrada. Visita de 15 min, grupos de hasta 40. No se entra con maletas grandes. Si se agota: visita guiada con Ad Artem (operador oficial del museo) o tours con guía en GetYourGuide o Tiqets; evitar reventas de boletos sueltos.\nOtros gastos del día (estimado): consigna en Milano Centrale ~44 €, trenes regionales al lago ~56 € (≈7 € por persona por trayecto) y ferry ~40 €; confirmar precios.", "main": ""}, {"activities": ["Puente de Rialto (15–30 min) · Sin reserva", "Plaza San Marcos (30 min) · Sin reserva", "Basílica de San Marcos (1 h) · Reserva recomendada: 13 € por persona, evita la fila", "Campanario de San Marcos (45 min) · Reserva recomendada: 15 € por persona en la web oficial, con hora de entrada; sube en ascensor a 98 m", "Palacio Ducal (2 h) · Reserva recomendada: evita la fila", "Puente de los Suspiros (15 min) · Sin reserva", "Librería Acqua Alta (30 min) · Sin reserva", "Gran Canal en góndola (30 min) · Sin reserva: se toma en el muelle; 90 € de día o 115 € de noche por góndola por 30 minutos, hasta 5 personas", "Opcional: Palacio Ca´ Rezzonico (1,5 h) · Sin reserva", "Opcional: Museo Leonardo Da Vinci (interactivo) (1 h) · Sin reserva", "Opcional: Burano (casas de colores, encajes y Museo del Encaje) (2–2,5 h) · Sin reserva: en vaporetto línea 12 desde Fondamente Nove (~45 min)", "Opcional: Paseo por Cannaregio (1–1,5 h) · Sin reserva: barrio local; Fondamenta della Misericordia y degli Ormesini, Gueto judío y Strada Nova, con bacari para cicchetti"], "costs": {"desayuno": {"c": "EUR", "m": null, "by": ""}, "almuerzo": {"c": "EUR", "m": null, "by": ""}, "cena": {"c": "EUR", "m": null, "by": ""}, "transporte": {"c": "EUR", "m": null, "by": ""}, "museos": {"c": "EUR", "m": 112, "by": ""}, "compras": {"c": "EUR", "m": null, "by": ""}, "otros": {"c": "EUR", "m": 90, "by": ""}}, "date": "2027-01-03", "id": "d10", "legs": [{"from": "Venecia", "dep": "", "to": "Venecia", "arr": "", "mode": ""}], "place": "VENECIA · Rialto y San Marcos", "reservas": "", "sleep": "Venecia", "stay": {"name": "", "rate": {"m": 367.42, "c": "USD", "by": "CE"}, "details": ""}, "tips": "Restaurantes VENECIA:\n**Pizzería L´Angelo**\n**Gelateria Suso** (helados artesanales, [[Sotoportego de la Bissa|Gelateria Suso, Sotoportego de la Bissa 5453, Venezia]], a pasos del Puente de Rialto)\n**Riva Rialto** (restaurante con terraza sobre el Gran Canal, en la [[Riva del Vin|Riva Rialto, Riva del Vin, Venezia]] junto al Puente de Rialto; conviene reservar mesa)\nAdquirir el \"Venecia Museum Pass\"\nComprar tiquetes del Vaporetto (autobús acuático)\nBarrio Dorsoduro (caminar, auténtico)\nRuta (domingo): mañana tranquila por Rialto (helado en Suso) y hacia San Marcos; la Basílica los domingos solo abre en la tarde (hacia las 14:00), luego el Campanario hacia las 15:30 (la luz del atardecer sobre la laguna es hacia las 16:30), después Palacio Ducal y Suspiros, Acqua Alta y góndola al atardecer. Visitas: unas 6 h sin Burano.\nSi van a Burano: ir en la mañana (vaporetto línea 12 desde Fondamente Nove, ~45 min; las tiendas de encaje y el museo abren el domingo) y volver hacia las 13:00 para la Basílica en la tarde; suma unas 3 h con los trayectos.\nCierres: el Mercado de Rialto no abre los domingos, por eso salió del plan; en Murano la mayoría de hornos de vidrio cierran el domingo, por eso Murano pasó al lunes 4 en la mañana, cuando los talleres trabajan.\nCa' Rezzonico está en Dorsoduro.\nCannaregio (el barrio que se había sugerido para hospedarse): el más local y auténtico, al norte, entre la estación y Rialto. Mejor al final de la tarde, cuando los bacari de la Fondamenta della Misericordia y degli Ormesini se llenan de venecianos (cicchetti y spritz). Desde San Marcos o Rialto se llega caminando por la Strada Nova en unos 20–25 min.\nCampanario: entradas en tickets.basilicasanmarco.it (la misma web oficial de la Basílica), 15 € por persona; se elige día y hora y piden llegar a tiempo (tolerancia de 5 min). En invierno abre todos los días desde las 9:30 hasta ~18:45. Se sube en ascensor, sin escaleras; vista de toda Venecia y la laguna.\nGóndola: tarifa por góndola (no por persona) por un paseo de 30 minutos, hasta 5 personas: 90 € de día y 115 € de noche (la tarifa nocturna suele aplicar desde las 19:00). Al atardecer, hacia las 16:30, aún es tarifa de día; caben los 4 en una sola.", "main": ""}, {"activities": ["Venecia: dejar las maletas en la consigna KiPoint de la estación [[Venezia Santa Lucia|KiPoint deposito bagagli, Stazione Venezia Santa Lucia, Fondamenta Santa Lucia, Venezia]] (15 min) · Sin reserva: andén 1, junto a la boletería principal; todos los días 6:00–23:00; ~6 € por maleta las primeras 5 h", "Venecia: Murano, hornos y talleres de vidrio con demostración (2 h) · Sin reserva: los lunes trabajan normal", "Venecia: volver a Santa Lucia y recoger las maletas antes del tren de las 12:30 (15 min) · Sin reserva: vaporetto 4.1 o 4.2 de Murano a Ferrovia", "Piazza del Duomo por fuera: fachada, Baptisterio y Campanario (20 min) · Sin reserva: la Catedral por dentro y la subida a la Cúpula son el martes 5", "Piazza della Signoria (aire libre) (30 min) · Sin reserva", "Escultura del Porcellino en el [[Mercato Nuovo|Fontana del Porcellino, Piazza del Mercato Nuovo, Firenze]] (10 min) · Sin reserva: la tradición es sobarle el hocico para volver a Florencia", "Ponte Vecchio (río Arno) (30 min) · Sin reserva", "Piazzale Michelangelo (mirador al atardecer, ~16:55) (1 h) · Sin reserva", "Capilla de los Medici ([[Cappelle Medicee|Museo delle Cappelle Medicee, Piazza di Madonna degli Aldobrandini 6, Firenze]]), en el último turno (45 min) · Reserva recomendada: último ingreso 18:10 y cierra los martes; ~14–15 € adulto con hora reservada (11 € en taquilla); la joven de 16 entra gratis pagando solo el cargo de reserva", "Cena en Trattoria Zazà ([[Piazza del Mercato Centrale 26r|Trattoria Zazà, Piazza del Mercato Centrale 26r, Firenze]]) (1,5 h) · Reserva recomendada: mesa para 4 hacia las 19:30; a 3 min de la Capilla de los Medici y de la Locanda"], "costs": {"desayuno": {"c": "EUR", "m": null, "by": ""}, "almuerzo": {"c": "EUR", "m": null, "by": ""}, "cena": {"c": "EUR", "m": null, "by": ""}, "transporte": {"c": "EUR", "m": null, "by": ""}, "museos": {"c": "EUR", "m": 47, "by": ""}, "compras": {"c": "EUR", "m": null, "by": ""}, "otros": {"c": "EUR", "m": 24, "by": ""}}, "date": "2027-01-04", "id": "d11", "legs": [{"from": "Venecia", "dep": "12:30", "to": "Florencia", "arr": "14:35", "mode": "tren", "dt": "Venezia Santa Lucia", "at": "Firenze Santa Maria Novella", "no": "Frecciarossa (n.º por definir al comprar)"}], "place": "FLORENCIA · Murano en la mañana, tarde en Florencia (Piazza del Duomo, Signoria, Ponte Vecchio, Piazzale, Capilla de los Medici y cena en Zazà)", "reservas": "Pendiente: tren Venezia Santa Lucia → Firenze SMN hacia las 12:30 (hora estimada, llega ~14:35; Frecciarossa ~2 h 05 min)\nPendiente: reservar mesa para 4 en Trattoria Zazà el lun 4-ene a las 19:30", "sleep": "Florencia", "stay": {"name": "Locanda Il Salimbecco · [[Via Canto dei Nelli 14, 50123 Florencia|Locanda Il Salimbecco, Via Canto dei Nelli 14, 50123 Firenze]]", "rate": {"m": 221, "c": "EUR", "by": "CE"}, "details": "Reserva Hotel Florencia: 1 noche\nConfirmación #6433506772\nCancelación hasta 30-dic\nIncluye: desayuno e internet"}, "tips": "Restaurantes FLORENCIA:\n**Misterpizza** (pizza en Plaza del Duomo)\n**All´antico Vinaio** (paninis)\n**Lampredotto** (sandwich)\n**Il Mercato Centrale** (compras y almuerzo)\n**Trattoria Zazà** (cocina toscana; [[Piazza del Mercato Centrale 26r|Trattoria Zazà, Piazza del Mercato Centrale 26r, Firenze]], junto al Mercato Centrale; cena fija del lunes 4 a las 19:30, con reserva)\n**Gustarium** (pizza al peso; [[Via dei Cimatori 24r|Gustarium, Via dei Cimatori 24r, Firenze]], junto a Orsanmichele)\n**Sogni e Sapori** (lasaña; [[Via dei Cimatori 22r|Sogni e Sapori, Via dei Cimatori 22r, Firenze]], al lado de Gustarium)\n**Pitti Express** (sándwiches, lasaña y tiramisú; en tus notas, carpaccio; [[Via Romana 54r|Pitti Express, Via Romana 54r, Firenze]], en el Oltrarno junto al Palazzo Pitti; 11:00–18:00, cierra los martes, así que solo el lunes 4)\n**Gelateria dei Neri** (de las mejores heladerías de Florencia; [[Via dei Neri 9r|Gelateria dei Neri, Via dei Neri 9r, Firenze]], a 5 min de la Signoria)\n**Pompi** (el famoso tiramisú de Roma, con local en Florencia; [[Via Faenza 37r|Pompi, Via Faenza 37r, Firenze]], a pasos de la Locanda y del Mercato Centrale; 8:00–22:00)\nVentanas de vino (buchette del vino): ventanitas en las fachadas por donde antes se vendía vino; se ven caminando por el centro y algunas aún sirven vino o helado, como la de Babae en el Oltrarno ([[Via Santo Spirito 21r|Babae, Via Santo Spirito 21r, Firenze]]).\nRuta: salir del hotel temprano con las maletas, vaporetto a la estación Santa Lucia (Ferrovia) y dejarlas en la consigna; vaporetto 4.1 o 4.2 a Murano (~20 min). Hornos y talleres de 9:00 a 11:30 (los lunes hay demostraciones de soplado). Volver en la 4.1/4.2 a Ferrovia, recoger maletas y tren de las 12:30 a Florencia.\nTarde en Florencia: dejar maletas en la Locanda, pasar por la Piazza del Duomo para verla por fuera, Signoria, el Porcellino del Mercato Nuovo (de camino al Ponte Vecchio), Ponte Vecchio y atardecer en el Piazzale Michelangelo (~16:55). Al bajar del Piazzale (bus 12 o 13, o ~30 min a pie), ir a la Capilla de los Medici, al lado de la Locanda, y entrar antes de las 18:10 (último ingreso). Es el único día posible: los martes cierra. Cerrar el día con la cena en Trattoria Zazà (19:30), a 3 min.\nCierres: los lunes cierran los Uffizi y la Accademia; la Catedral por dentro, la subida a la Cúpula y el Palazzo Vecchio pasaron a la tarde del martes 5 (Catedral y Cúpula juntas).\nConsigna en Venezia Santa Lucia: KiPoint, dentro de la estación ([[Fondamenta Santa Lucia, Venecia|KiPoint deposito bagagli, Stazione Venezia Santa Lucia, Fondamenta Santa Lucia, Venezia]]), en el andén 1 junto a la boletería principal. Abre todos los días de 6:00 a 23:00, así que cubre de la llegada (~8:15) a la salida (~12:15); ~6 € por maleta las primeras 5 horas (~24 € las 4).", "main": ""}, {"activities": ["Florencia: Galería degli Uffizi (museo y pinacoteca) (2,5–3 h) · Reserva obligatoria: entrada de las 8:15, tarifa madrugadora", "Florencia: Galleria dell´Accademia (David) (1 h) · Reserva obligatoria: entrada hacia las 11:00–11:15", "Florencia: almuerzo en el Mercato Centrale (1 h) · Sin reserva", "Florencia: Catedral de Santa Maria del Fiore por dentro (45 min) · Sin reserva: entrada gratis; cierra hacia las 16:30", "Florencia: subida a la Cúpula de Brunelleschi (463 escalones) (1–1,5 h) · Reserva obligatoria: Brunelleschi Pass con hora fija (~13:45); ~30 € por persona; incluye también Campanario, Baptisterio, Museo y Santa Reparata", "Florencia: Iglesia de Orsanmichele ([[Via dei Calzaiuoli|Chiesa di Orsanmichele, Via dell'Arte della Lana, Firenze]]) (15 min) · Sin reserva: de camino al Palazzo Vecchio; confirmar el horario del día", "Florencia: Palazzo Vecchio (Salón de los Quinientos) (1–1,5 h) · Reserva recomendada", "Opcional: subir la torre del Palazzo Vecchio (45 min) · Reserva recomendada: subida con horario; cierra si llueve", "Opcional: Iglesia de Santa Maria Novella ([[Piazza di Santa Maria Novella|Basilica di Santa Maria Novella, Piazza di Santa Maria Novella 18, Firenze]]) (45 min) · Sin reserva: frente a la estación; cierra hacia las 17:30; boleto en taquilla; solo si no suben a la torre", "Florencia: recoger las maletas en la Locanda (plan A) o en la consigna de la estación (plan B) y caminar a Santa Maria Novella (30 min) · Sin reserva: hacia las 16:45; el tren a Roma sale a las 18:00", "Florencia: Farmacia de Santa Maria Novella ([[Via della Scala 16|Officina Profumo-Farmaceutica di Santa Maria Novella, Via della Scala 16, Firenze]]) (20–30 min) · Sin reserva: la farmacia más antigua de Europa; perfume Acqua della Regina; a 5 min de la estación, de camino al tren", "Opcional: cena en el Pigneto, barrio local de Roma (1,5 h) · Sin reserva: metro C desde San Giovanni"], "costs": {"desayuno": {"c": "EUR", "m": null, "by": ""}, "almuerzo": {"c": "EUR", "m": null, "by": ""}, "cena": {"c": "EUR", "m": null, "by": ""}, "transporte": {"c": "EUR", "m": null, "by": ""}, "museos": {"c": "EUR", "m": 266, "by": ""}, "compras": {"c": "EUR", "m": null, "by": ""}, "otros": {"c": "EUR", "m": null, "by": ""}}, "date": "2027-01-05", "id": "d12", "legs": [{"from": "Florencia", "dep": "18:00", "to": "Roma", "arr": "19:35", "mode": "tren", "dt": "Firenze Santa Maria Novella", "at": "Roma Termini", "no": "Frecciarossa (n.º por definir al comprar)"}], "place": "ROMA · Florencia todo el día (Uffizi, Accademia, Catedral y Cúpula, Palazzo Vecchio) y tren a Roma al final de la tarde", "reservas": "Pendiente: entradas Uffizi 8:15 (tarifa madrugadora 19 €; entrar antes de las 8:55) y Accademia hacia las 11:00–11:15 para el 5-ene, en las webs oficiales (uffizi.it y galleriaaccademiafirenze.it): 3 Full + 1 Free (menor); no usar Reduced, es solo para ciudadanos UE de 18 a 25 años\nPendiente: tren Florencia SMN → Roma Termini hacia las 18:00 (hora estimada, llega ~19:35; Frecciarossa ~1 h 35 min)\nPendiente: avisar al anfitrión del Airbnb de Roma la llegada hacia las 20:00\nPendiente: pedir a la Locanda que guarde las maletas después del check-out hasta ~17:15 (plan A)\nPlan B: consigna KiPoint en la estación [[Firenze Santa Maria Novella|KiPoint deposito bagagli, Stazione Firenze Santa Maria Novella, Piazza della Stazione, Firenze]], a lo largo del andén 16; todos los días 7:00–21:00; ~6 € por maleta las primeras 5 h y 1 € por hora extra (~11 € por maleta de 7:30 a 17:30) o 10 € por maleta las 24 h reservando en línea", "sleep": "Roma", "stay": {"name": "Airbnb Casa Merlo, [[Via Merulana 117, 00185 Roma RM, Lazio|Via Merulana 117, 00185 Roma]]", "rate": {"m": 257, "c": "EUR", "by": "CE"}, "details": "Reserva Airbnb Roma: 5 noches\nCódigo: PXQ97A4G\nCódigo confirmación: HMHEQAJCBQ\nCancelación hasta 31-dic (3pm)\nIncluye: 2 hab, 3 camas, 2 baños, internet"}, "tips": "Ruta: Uffizi a la apertura (8:15, tarifa madrugadora 19 € en vez de 25 €; salas de Botticelli sin gente) hasta las 10:45; caminar 15 min a la Accademia (David) de 11:00 a 12:00; almuerzo en el Mercato Centrale, a 5 min. En la tarde, a 5 min del Mercato: la Catedral por dentro (gratis, 13:00–13:40) y la subida a la Cúpula con el Brunelleschi Pass (hora reservada ~13:45; se entra por la Porta della Mandorla, en el costado norte de la Catedral; 463 escalones, ~1 h). Bajando por Via dei Calzaiuoli, parada corta en Orsanmichele y 5 min más hasta el Palazzo Vecchio (15:15–16:30); la torre es opcional y suma unos 45 min, si hay energía y buen clima. Hacia las 16:45 recoger las maletas en la Locanda, pasar con ellas por la Farmacia de Santa Maria Novella (Via della Scala, perfume Acqua della Regina) y caminar 5 min a la estación para el tren de las 18:00. La Iglesia de Santa Maria Novella (frente a la estación, cierra ~17:30) queda como opcional si no suben a la torre; llegada a Roma Termini ~19:35 y unos 15 min a pie (o taxi) al Airbnb de Via Merulana. Visitas: 8 a 9 h.\nOpcional, si queda energía: cena en el Pigneto (barrio de romanos, sin turistas): metro A a San Giovanni y línea C dos paradas hasta Pigneto; regreso igual.\nCambio: Santa María la Mayor, San Juan de Letrán y la Escalera Santa pasaron a la tarde del sábado 9, entre Piazza del Popolo y el partido.\nCierres: San Pedro Encadenado y San Clemente están el jueves 7, junto al Coliseo.\nMaletas (martes 5): plan A, pedir a la Locanda ([[Via Canto dei Nelli 14|Locanda Il Salimbecco, Via Canto dei Nelli 14, 50123 Firenze]], a 7 min a pie de la estación) que las guarde después del check-out hasta ~17:15. Plan B: dejarlas a las 7:30 en la consigna KiPoint de [[Santa Maria Novella, andén 16|KiPoint deposito bagagli, Stazione Firenze Santa Maria Novella, Piazza della Stazione, Firenze]] (abre 7:00–21:00) antes de ir a los Uffizi, y recogerlas al volver para el tren de las 18:00; ~40–44 € las 4 por el día.\nBrunelleschi Pass: es el único boleto que incluye la Cúpula (no venden la Cúpula sola). Se compra en tickets.duomo.firenze.it con nombre, apellido y nacionalidad de cada uno; en la entrada revisan el documento. Hora fija con ~5 min de tolerancia; no se puede cambiar ni reembolsar. Vale 3 días e incluye Campanario, Baptisterio, Museo de la Ópera y la cripta de Santa Reparata, por si sobra tiempo. Gratis solo los menores de 7 años.", "main": ""}, {"activities": ["Misa de Epifanía o Ángelus del Papa (Plaza San Pedro) (1,5–2 h) · Reserva obligatoria: boletos gratis para la misa; el Ángelus no requiere", "Basílica de San Pedro (1,5 h) · Sin reserva: gratis, fila de seguridad", "Castillo Sant'Angelo (1,5 h) · Reserva recomendada: es festivo", "Piazza Navona (mercado de Navidad y la Befana) (1 h) · Sin reserva", "Campo de' Fiori (30 min) · Sin reserva", "Almue /* ---------- Status & save ---------- */
var statusText="",statusErr=false;

function showStatus(){var el=document.getElementById("status");if(el){el.textContent=statusText;el.className="status"+(statusErr?" err":"");}}

function flush(){
  dirty=false;state.updatedAt=Date.now();
  try{localStorage.setItem(DRAFT_KEY,JSON.stringify(state));}catch(e){}
  setStatus(canPublish?"Cambios guardados en este dispositivo":"Guardado");scheduleSnapshot();
}

/* Never swap the DOM in the middle of a tap, or the tap is lost */

  if(act==="goto"){tab="itin";if(view==="cal"){openDetail(i);return;}openDay=state.days[i].id;render();var li2=document.getElementById("day-"+i);if(li2)li2.scrollIntoView({block:"start"});return;}
  if(act==="export"){exportCsv();return;}
  if(act==="bk-goto"){var el=document.getElementById("bk-"+b.getAttribute("data-id"));if(el){el.scrollIntoView({block:"center",behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});el.classList.add("flash");setTimeout(function(){el.classList.remove("flash");},1600);}return;}
  if(act==="bk-open"&&!readOnly){var bid=b.getAttribute("data-id");openBk=openBk===bid?null:bid;render();if(!openBk)scheduleSnapshot();return;}
  if(act==="bk-add"&&!readOnly){var ref=state.bookings[i],nb={id:"b"+Date.now().toString(36)+Math.random().toString(36).slice(2,6),sec:ref.sec,date:ref.date,cat:"atraccion",title:"",need:"",done:false,info:"",mode:""};
    state.bookings.splice(i+1,0,nb);openBk=nb.id;scheduleSave();render();var t=app.querySelector('[data-bind="bookings.'+(i+1)+'.title"]');if(t)t.focus();return;}
  if(act==="bk-del"&&!readOnly){var bb=state.bookings[i];if(!confirm("¿Eliminar la reserva \""+(bb.title||"sin nombre")+"\"?"))return;state.bookings.splice(i,1);openBk=null;scheduleSave();render();return;}
  if(readOnly)return;
  if(act==="add-day"){var last=state.days[state.days.length-1],nd;
    if(last&&pd(last.date)){var dt=pd(last.date);dt.setDate(dt.getDate()+1);nd=newDay(iso(dt));nd.sleep=last.sleep;}else nd=newDay("");
    state.days.push(nd);openDay=nd.id;scheduleSave();render();var li3=document.getElementById("day-"+(state.days.length-1));if(li3)li3.scrollIntoView({block:"start"});return;}
  if(act==="del-day"){var d=state.days[i];if(!confirm("¿Eliminar el día "+(i+1)+" ("+dLabel(d.date)+")? No se puede deshacer."))return;state.days.splice(i,1);openDay=null;scheduleSave();render();return;}
  if(act==="add-leg"){var ds=state.days[i],prev=ds.legs[ds.legs.length-1];ds.legs.push({from:prev?prev.to:"",dep:"",to:"",arr:"",mode:""});scheduleSave();render();focusLast('[data-bind^="days.'+i+'.legs."][data-bind$=".from"]');return;}
  if(act==="del-leg"){state.days[i].legs.splice(j,1);scheduleSave();render();return;}
  if(act==="add-act"){state.days[i].activities.push("");scheduleSave();render();focusLast('[data-bind^="days.'+i+'.activities."]');return;}
  if(act==="del-act"){state.days[i].activities.splice(j,1);scheduleSave();render();return;}
});
document.addEventListener("keydown",function(e){if(detail==null)return;
  if(e.key==="Escape"){e.preventDefault();var was=detail;detail=null;render();var cell=app.querySelector('.cc[data-i="'+was+'"]');if(cell)cell.focus({preventScroll:true});}
  else if(e.key==="ArrowLeft"&&detail>0&&!editing())openDetail(detail-1);
  else if(e.key==="ArrowRight"&&detail<state.days.length-1&&!editing())openDetail(detail+1);});
function focusLast(sel){var els=app.querySelectorAll(sel);if(els.length)els[els.length-1].focus();}

/* ---------- CSV export ---------- */
function exportCsv(){
  if(!downloads)return;
  var cols=["Día de viaje","Fecha","Lugar salida","Hora salida","Lugar llegada","Hora llegada","Estadía","Dormida","Hotel / Airbnb","Tarifa hotel","Desayuno","Almuerzo","Cena","Transportes","Museos, visitas","Compras y regalos","Otros gastos","Total en euros","Reservas","Restaurantes y recomendaciones"];
  function q(v){v=v==null?"":String(v);return /[";\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}
  function money(c){return c&&c.m!=null&&c.m!==""?c.c+" "+fmt(+c.m,2):"";}
  var lines=[cols.map(q).join(";")];
  state.days.forEach(function(d,i){var t=dayTotals(d),legs=d.legs.length?d.legs:[{}];
    legs.forEach(function(l,k){var first=k===0;
      lines.push([first?i+1:"",first?d.date:"",l.from||"",l.dep||"",l.to||"",l.arr||"",first?(d.place+(d.activities.length?"\n"+d.activities.join(" / "):"")):"",first?d.sleep:"",first?plain(d.stay.name+(d.stay.details?"\n"+d.stay.details:"")):"",first?money(d.stay.rate):""]
        .concat(CATS.map(function(c){return first?money(d.costs[c[0]]):"";})).concat([first?Math.round(t.total):"",first?plain(d.reservas):"",first?plain(d.tips):""]).map(q).join(";"));});});
  var T=allTotals();
  lines.push(["","","","","","","","","TOTALES (EUR)",Math.round(T.hotel)].concat(CATS.map(function(c){return Math.round(T[c[0]]);})).concat([Math.round(T.total),"",""]).map(q).join(";"));
  downloads.save({filename:"viaje-europa.csv",data:"\uFEFF"+lines.join("\r\n")}).then(function(){setStatus("CSV descargado");},function(e){
    if(e&&e.code==="declined")return; setStatus("No se pudo descargar el CSV.",true);});
}

/* ---------- Shared snapshot (what anyone with the link sees) ---------- */
function stable(o){if(Array.isArray(o))return "["+o.map(stable).join(",")+"]";
  if(o&&typeof o==="object")return "{"+Object.keys(o).sort().filter(function(k){return o[k]!==undefined;}).map(function(k){return JSON.stringify(k)+":"+stable(o[k]);}).join(",")+"}";
  return JSON.stringify(o===undefined?null:o);}
function fmtStamp(ms){var d=new Date(ms);if(isNaN(d))return "";return d.getDate()+" "+MO[d.getMonth()]+" "+d.getFullYear()+", "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");}
function snapStale(){return canPublish&&!!state&&stable(state)!==snapStr;}
function updatePubBar(){var el=document.getElementById("pubbar");if(!el)return;
  if(!snapStale()||publishing){el.innerHTML="";return;}
  el.innerHTML='<span>Hay cambios sin publicar: se publican solos al cerrar la edición del día.</span><button data-act="publish-now">Publicar ahora</button>';}
function scheduleSnapshot(delay){clearTimeout(pubTimer);updatePubBar();if(!snapStale())return;pubTimer=setTimeout(function(){trySnapshot(false);},delay==null?3000:delay);}
function buildHtml(){
  var css=document.getElementById("app-css").textContent, js=document.getElementById("app-js").textContent;
  var data=JSON.stringify({at:Date.now(),state:state}).replace(/</g,"\\u003c").replace(/\u2028/g,"\\u2028").replace(/\u2029/g,"\\u2029");
  var SC="script";
  return '<!doctype html>\n<html lang="es">\n<head>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">\n<title>App Europa 2026</title>\n'+
    '<link rel="preconnect" href="https://fonts.googleapis.com">\n<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n'+
    '<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">\n'+
    '<style id="app-css">'+css+'</style>\n</head>\n<body>\n<div class="wrap" id="app"><p class="sub" style="padding-top:40px">Cargando el viaje…</p></div>\n'+
    '<'+SC+' type="application/json" id="trip-data">'+data+'</'+SC+'>\n<'+SC+' id="app-js">'+js+'</'+SC+'>\n</body>\n</html>\n';
}
function stashUi(){try{sessionStorage.setItem(UI_KEY,JSON.stringify({tab:tab,view:view,openDay:openDay,openBk:openBk,detail:detail,y:window.scrollY}));}catch(e){}}
function trySnapshot(force){
  clearTimeout(pubTimer);
  if(!snapStale()||publishing){updatePubBar();return;}
  if(dirty||saving){if(dirty)flush();pubTimer=setTimeout(function(){trySnapshot(force);},800);return;}
  if(!force&&(openDay!=null||openBk!=null||editing()))return;
  publishing=true;updatePubBar();stashUi();setStatus("Publicando cambios…");
  artifactNs.publish(buildHtml()).then(function(){setStatus("Publicado");},function(e){
    publishing=false;var c=e&&e.code;
    if(c==="conflict")return;
    try{sessionStorage.removeItem(UI_KEY);}catch(_){}
    if(c==="rate_limited"){setStatus("Guardado");scheduleSnapshot(60000);return;}
    if(c==="upstream_error"&&!pubRetried){pubRetried=true;scheduleSnapshot(2000+Math.random()*3000);return;}
    if(c==="too_large"){setStatus("El plan es demasiado grande para el enlace compartido.",true);canPublish=false;updatePubBar();return;}
    canPublish=false;updatePubBar();
    if(c&&c!=="not_writer"&&c!=="not_granted"&&c!=="not_declared"&&c!=="consent_required")setStatus("No se pudo actualizar el enlace compartido.",true);
  });
}
document.addEventListener("visibilitychange",function(){if(document.visibilityState==="hidden"&&snapStale())trySnapshot(true);});

/* ---------- Boot ---------- */
(function(){
  var emb=null;try{emb=JSON.parse(document.getElementById("trip-data").textContent);}catch(e){}
  snapAt=emb&&emb.at||null;
  state=normalize(emb&&emb.state?clone(emb.state):null);
  snapStr=stable(state);
  var ui=null;try{ui=JSON.parse(sessionStorage.getItem(UI_KEY)||"null");sessionStorage.removeItem(UI_KEY);}catch(e){}
  if(ui){tab=ui.tab||tab;view=ui.view||view;openDay=ui.openDay||null;openBk=ui.openBk||null;detail=typeof ui.detail==="number"?ui.detail:null;}
  readOnly=true;render();
  if(ui&&ui.y)setTimeout(function(){window.scrollTo(0,ui.y);},0);
})();
(async function(){
  var C=window.claude;
  if(!C||typeof C.use!=="function"){mode="snapshot";render();return;}
  var u=null;try{u=await C.use("user");}catch(e){u=null;}
  var ed=false;try{if(u)ed=(await u.canEdit())===true;}catch(e){ed=false;}
  if(ed){try{artifactNs=await C.use("artifact");}catch(e){artifactNs=null;}}
  if(!ed||!artifactNs){mode="snapshot";render();return;}
  try{downloads=await C.use("downloads");}catch(e){downloads=null;}
  mode="page";readOnly=false;canPublish=true;
  /* recuperar cambios que no alcanzaron a publicarse */
  var dr=null;try{dr=JSON.parse(localStorage.getItem(DRAFT_KEY)||"null");}catch(e){}
  if(dr&&dr.updatedAt&&(!snapAt||dr.updatedAt>snapAt)&&stable(normalize(clone(dr)))!==snapStr){state=normalize(dr);setStatus("Recuperé cambios sin publicar de este dispositivo");}
  else{try{localStorage.removeItem(DRAFT_KEY);}catch(e){}}
  render();updatePubBar();
})();
})();
</script>
